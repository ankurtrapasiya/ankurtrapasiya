  name: ankurtrapasiya
  email: ankur.trapasiya@gmail.com
description: > 
  I'm Ankur Trapasiya and I'm a Software Professional. I intend to express my thoughts and learning 
  through this blog.  

show_excerpts: true # set to true to show excerpts on the homepage

# Minima date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%b %-d, %Y"

  # generate social links in footer
  social_links:
    twitter: ankurtrapasiya
    github:  ankurtrapasiya
    linkedin: ankurtrapasiya
    # youtube: jekyll
    # youtube_channel: UC8CXR0-3I70i1tfPg1PAE1g
    # youtube_channel_name: CloudCannon
    keybase: trapaank

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
header_pages:
  - projects.md
  - about.md

# Build settings
theme: minima

plugins:
 - jekyll-feed
 - jekyll-seo-tag
